experiment:
  name: dummy_bev_resnet_regression
  seed: 42

model_config: models/bev_resnet_regression.yaml
dataset_config: datasets/dummy.yaml

train:
  epochs: 50
  batch_size: 512
  lr: 0.0001
  weight_decay: 0.00001
  scheduler: cosine
  
  amp: true
  loss_alpha: 0.7 # 0.7
  loss_beta: 0.3 # 0.3
  weight_factor: 3.0 # 3.0
  huber_delta_deg: 0.5 # 0.5

  joint_shift_x: 0.0

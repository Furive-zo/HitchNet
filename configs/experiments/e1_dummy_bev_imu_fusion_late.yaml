experiment:
  name: E1_dummy_bev_imu_fusion_late
  type: in_domain
  seed: 42

model_config: models/bev_imu_fusion.yaml
dataset_config: datasets/dummy.yaml

train:
  epochs: 50
  batch_size: 32
  lr: 0.0001
  weight_decay: 0.00001
  scheduler: cosine

eval:
  apply_kf: false
  save_predictions: true

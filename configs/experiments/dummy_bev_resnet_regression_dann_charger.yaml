experiment:
  name: dummy_bev_resnet_regression_dann_charger
  seed: 42

model_config: models/bev_resnet_dann.yaml
dataset_config: datasets/dummy.yaml
target_dataset_config: datasets/charger.yaml

train:
  epochs: 50
  batch_size: 512
  lr: 0.0001
  weight_decay: 0.00001
  scheduler: cosine
  amp: true

  # regression loss
  loss_alpha: 0.7
  loss_beta: 0.3
  weight_factor: 3.0
  huber_delta_deg: 0.5

  # DANN
  domain_loss_w: 0.1
  grl_lambda_max: 1.0
  target_use_ratio: 0.1

  # keep raw bev setting (no augmentation / no extra alignment)
  joint_shift_x: 0.0


experiment:
  name: E1_charger_bev_imu_fusion_late_norm
  type: in_domain
  seed: 42

model_config: models/bev_imu_fusion.yaml
dataset_config: datasets/charger.yaml

train:
  epochs: 50
  batch_size: 32
  lr: 0.0001
  weight_decay: 0.00001
  scheduler: cosine
  normalize_xy: true

eval:
  apply_kf: false
  save_predictions: true

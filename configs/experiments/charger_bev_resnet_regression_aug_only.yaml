experiment:
  name: charger_bev_resnet_regression_aug_only
  seed: 42

model_config: models/bev_resnet_regression.yaml
dataset_config: datasets/charger.yaml

train:
# Training
  epochs: 50
  batch_size: 512
  lr: 0.0001
  weight_decay: 0.00001
  scheduler: cosine
  amp: true

# Loss
  loss_alpha: 0.7
  loss_beta: 0.3
  weight_factor: 3.0
  huber_delta_deg: 0.5

# No alignment (augmentation-only setting)
  normalize_xy: false
  bev_use_hmax: true
  bev_add_xy: false
  occ_binary: false
  dlog_range_norm: false
  add_observed_mask: false
  joint_shift_x: 0.0

# Augmentation only
  aug_vis: true
  aug_vis_max: 20
  oversample_alpha: 0.5
  oversample_max_w: 3.0
  oversample_K: 240
  aug_rotate_prob: 0.5
  aug_rotate_target_min_deg: -60
  aug_rotate_target_max_deg: 60
  save_aug_hist: false
  occ_prob: 0.5
  occ_x_thresh: -2.0
  occ_box_x: 1.5
  occ_box_y: 2.0
  trans_prob: 0.5
  trans_max_m: 1.0
  trans_dir: both

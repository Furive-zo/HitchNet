experiment:
  name: dummy_charger_bev_resnet_regression_mixstyle_dg
  seed: 42

model_config: models/bev_resnet_regression_mixstyle.yaml
dataset_config: datasets/dummy.yaml
source_dataset_configs:
  - datasets/dummy.yaml
  - datasets/charger.yaml

train:
  epochs: 50
  batch_size: 512
  lr: 0.0001
  weight_decay: 0.00001
  scheduler: cosine
  amp: true

  loss_alpha: 0.7
  loss_beta: 0.3
  weight_factor: 3.0
  huber_delta_deg: 0.5

  # raw BEV setting
  normalize_xy: false
  bev_add_xy: false
  bev_add_orient: false
  bev_use_hmax: true
  bev_use_dlog: true
  occ_binary: false
  add_observed_mask: false
  joint_shift_x: 0.0
